<template>
  <div class="page">
    <text class="title">🎣腕上钓客</text>
    <text class="tip">{{tip}}</text>
    <text class="water">{{scene}}</text>
    <text class="stat">鱼:{{fishCnt}}｜币:{{coin}}｜竿Lv.{{rodLv}}</text>
    <button class="btn" onclick="{{tap}}">{{btnText}}</button>
  </div>
</template>

<script>
import device from '@system.device'
export default {
  data() {
    return {
      tip:"等待鱼咬钩...",
      scene:"～～～～～\n　　●\n～～～～～",
      fishCnt:0,
      coin:0,
      rodLv:1,
      bite:false,
      timer:null,
      btnText:"抛竿",
      isCapsule:true, // true=标准版胶囊屏 false=Pro矩形大屏
      fontSize:14
    }
  },
  onInit(){
    // 自动识别屏幕，区分标准版与Pro版
    const self = this
    device.getInfo({
      success(res){
        const w = res.screenWidth
        // 宽度小于250=胶囊标准版(9/10/11)；大于300=Pro矩形大屏
        self.isCapsule = w < 250
        self.fontSize = self.isCapsule ? 12 : 14
      }
    })
    self.loadSave()
  },
  tap(){
    if(this.bite){
      this.hook()
    }else{
      this.cast()
    }
  },
  // 抛竿逻辑（不变）
  cast(){
    this.tip="已抛竿，静候..."
    this.bite=false
    this.btnText="提竿"
    this.scene="～～～～～\n　　●\n～～～～～"
    const t = 1000 + Math.random()*7000
    clearTimeout(this.timer)
    this.timer = setTimeout(()=>{
      this.bite=true
      this.tip="浮漂下沉！快提竿！"
      this.scene="～～～～～\n　▼\n～～～～～"
      setTimeout(()=>{
        if(this.bite){
          this.bite=false
          this.tip="跑鱼了！慢了一步"
        }
      },750)
    },t)
  },
  // 提竿钓鱼（成长系统，保证耐玩）
  hook(){
    this.bite=false
    const r = Math.random()
    let name, reward
    const bonus = this.rodLv * 0.04
    if(r < 0.55 + bonus){
      name="小鱼"; reward=1
    }else if(r<0.80+bonus){
      name="鲫鱼"; reward=3
    }else if(r<0.93+bonus){
      name="鲤鱼"; reward=8
    }else if(r<0.985){
      name="草鱼"; reward=18
    }else{
      name="✨锦鲤"; reward=50
    }
    this.fishCnt++
    this.coin += reward
    this.tip=`钓到【${name}】+${reward}金币`
    this.scene="～～～～～\n🐟\n～～～～～"
    this.saveSave()
  },
  // 本地存档（全机型通用）
  saveSave(){
    const data = {fishCnt:this.fishCnt,coin:this.coin,rodLv:this.rodLv}
    this.$app.$data.storage.set("fishing_save",JSON.stringify(data))
  },
  loadSave(){
    try{
      const s = this.$app.$data.storage.get("fishing_save")
      if(s){
        const d = JSON.parse(s)
        this.fishCnt=d.fishCnt
        this.coin=d.coin
        this.rodLv=d.rodLv
      }
    }catch(e){}
  }
}
</script>

<style>
.page{
  flex-direction:column;
  justify-content:center;
  padding:8px;
}
.title{
  text-align:center;
  margin-bottom:4px;
}
.tip{
  text-align:center;
  margin:3px 0;
}
.water{
  text-align:center;
  white-space:pre;
  margin:6px 0;
}
.stat{
  text-align:center;
  margin-bottom:6px;
}
.btn{
  height:36px;
  font-size:15px;
}
/* 胶囊窄屏（9/10/11标准版）缩小字号 */
@media (width <= 250px) {
  .title{font-size:18px;}
  .tip{font-size:12px;}
  .water{font-size:11px;}
  .stat{font-size:11px;}
}
/* Pro矩形宽屏（9Pro/10Pro）放大字号 */
@media (width >= 320px) {
  .title{font-size:22px;}
  .tip{font-size:16px;}
  .water{font-size:14px;}
  .stat{font-size:14px;}
}
</style>
